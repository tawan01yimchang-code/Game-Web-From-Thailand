<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game - Classic Nokia Style</title>
    <!-- Tailwind CSS for layout framing -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Retro Vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* Custom Nokia LCD Screen & Vintage Aesthetic */
        :root {
            --lcd-bg: #9bbc0f;
            --lcd-pixel-dark: #0f380f;
            --lcd-pixel-light: #8bac0f;
            --lcd-grid-line: #84a20d;
        }

        body {
            font-family: 'VT323', monospace;
            background-color: #1a1a24;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .press-start {
            font-family: 'Press Start 2P', cursive;
        }

        /* Phone Body & Screen Frame */
        .nokia-body {
            background: linear-gradient(145deg, #434955, #2c313a);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.2);
            border: 4px solid #1e222b;
        }

        .lcd-screen-container {
            background-color: var(--lcd-bg);
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.4), inset -2px -2px 5px rgba(255,255,255,0.3);
            border: 8px solid #222;
            position: relative;
        }

        /* Subtle LCD Grid Effect */
        .lcd-screen-container::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        /* Retro Buttons Styling */
        .dpad-btn {
            background: linear-gradient(145deg, #3a3f4d, #252932);
            box-shadow: 0 5px 0 #181a20, 0 8px 10px rgba(0,0,0,0.4);
            transition: all 0.05s ease;
        }

        .dpad-btn:active, .dpad-btn.active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #181a20, 0 3px 5px rgba(0,0,0,0.4);
            background: linear-gradient(145deg, #252932, #3a3f4d);
        }

        .action-btn {
            background: linear-gradient(145deg, #d9534f, #b52b27);
            box-shadow: 0 4px 0 #7a1c19, 0 5px 8px rgba(0,0,0,0.3);
        }

        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #7a1c19, 0 2px 4px rgba(0,0,0,0.3);
        }

        .action-btn-secondary {
            background: linear-gradient(145deg, #6c757d, #495057);
            box-shadow: 0 4px 0 #212529, 0 5px 8px rgba(0,0,0,0.3);
        }

        .action-btn-secondary:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #212529, 0 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4 text-slate-900">

    <!-- Phone Wrapper -->
    <div class="nokia-body w-full max-w-md rounded-3xl p-4 sm:p-6 flex flex-col items-center">
        
        <!-- Header Brand -->
        <div class="w-full flex justify-between items-center mb-3 px-2">
            <span class="press-start text-xs text-gray-300 tracking-widest uppercase">NOKIA 3310</span>
            <div class="flex items-center space-x-2">
                <button id="soundToggle" class="text-xs text-gray-300 hover:text-white flex items-center gap-1 bg-gray-700/50 px-2 py-1 rounded">
                    <span id="soundIcon">🔊</span> <span id="soundText" class="hidden sm:inline">SOUND ON</span>
                </button>
            </div>
        </div>

        <!-- LCD Screen Frame -->
        <div class="lcd-screen-container w-full rounded-lg p-3 text-[#0f380f] flex flex-col items-center">
            
            <!-- Top Status Bar -->
            <div class="w-full flex justify-between items-center border-b-2 border-[#0f380f] pb-1 mb-2 text-xl font-bold tracking-wide">
                <div>SCORE: <span id="currentScore">0000</span></div>
                <div>HI: <span id="highScore">0000</span></div>
            </div>

            <!-- Main Canvas Screen -->
            <div class="relative w-full aspect-square flex items-center justify-center">
                <canvas id="gameCanvas" class="bg-[#9bbc0f] border-2 border-[#0f380f]"></canvas>

                <!-- Overlay Messages (Game Over / Pause / Start) -->
                <div id="overlay" class="absolute inset-0 bg-[#9bbc0f]/90 flex flex-col items-center justify-center p-4 text-center z-20">
                    <h1 id="overlayTitle" class="press-start text-lg sm:text-xl font-bold mb-3 text-[#0f380f]">SNAKE II</h1>
                    <p id="overlaySub" class="text-xl sm:text-2xl mb-4 text-[#0f380f]">กด START เพื่อเริ่มเล่น</p>
                    
                    <!-- Difficulty Selector -->
                    <div id="difficultyBox" class="flex flex-col items-center gap-1 mb-4">
                        <label class="text-sm font-bold tracking-wider">ระดับความเร็ว (SPEED):</label>
                        <div class="flex gap-2">
                            <button class="diff-btn px-3 py-1 text-base font-bold border-2 border-[#0f380f] rounded bg-[#8bac0f]" data-speed="150">ช้า</button>
                            <button class="diff-btn px-3 py-1 text-base font-bold border-2 border-[#0f380f] rounded bg-[#0f380f] text-[#9bbc0f]" data-speed="100">ปานกลาง</button>
                            <button class="diff-btn px-3 py-1 text-base font-bold border-2 border-[#0f380f] rounded bg-[#8bac0f]" data-speed="65">เร็ว</button>
                        </div>
                    </div>

                    <button id="startBtn" class="press-start text-xs sm:text-sm px-4 py-2 bg-[#0f380f] text-[#9bbc0f] rounded hover:opacity-90 active:scale-95 transition-all">
                        START GAME
                    </button>
                </div>
            </div>

            <!-- Bottom Info Bar -->
            <div class="w-full flex justify-between items-center text-xs mt-2 pt-1 border-t border-[#0f380f]/40 font-bold">
                <span>SPEED: <span id="speedLabel">NORMAL</span></span>
                <span>STATUS: <span id="gameStatus">READY</span></span>
            </div>
        </div>

        <!-- Utility Action Buttons (Start / Pause / Reset) -->
        <div class="w-full grid grid-cols-3 gap-2 mt-4 px-2">
            <button id="pauseBtn" class="action-btn-secondary text-white font-bold py-2 rounded-lg text-sm tracking-wider uppercase">
                PAUSE
            </button>
            <button id="restartBtn" class="action-btn text-white font-bold py-2 rounded-lg text-sm tracking-wider uppercase">
                RESTART
            </button>
            <button id="menuBtn" class="action-btn-secondary text-white font-bold py-2 rounded-lg text-sm tracking-wider uppercase">
                MENU
            </button>
        </div>

        <!-- Virtual D-Pad Controller Section -->
        <div class="w-full max-w-[280px] mt-4 mb-2">
            <div class="grid grid-cols-3 gap-2 text-white">
                <div></div>
                <button id="btnUp" class="dpad-btn h-14 rounded-t-xl flex items-center justify-center text-2xl font-bold select-none active:bg-slate-700">
                    ▲
                </button>
                <div></div>

                <button id="btnLeft" class="dpad-btn h-14 rounded-l-xl flex items-center justify-center text-2xl font-bold select-none active:bg-slate-700">
                    ◄
                </button>
                <div class="h-14 bg-slate-800/40 rounded-full flex items-center justify-center text-gray-500 text-xs border border-slate-700/50">
                    OK
                </div>
                <button id="btnRight" class="dpad-btn h-14 rounded-r-xl flex items-center justify-center text-2xl font-bold select-none active:bg-slate-700">
                    ►
                </button>

                <div></div>
                <button id="btnDown" class="dpad-btn h-14 rounded-b-xl flex items-center justify-center text-2xl font-bold select-none active:bg-slate-700">
                    ▼
                </button>
                <div></div>
            </div>
        </div>

        <!-- Touch/Keyboard Hint Footer -->
        <div class="text-center text-xs text-gray-400 mt-1">
            รองรับปุ่มลูกศร 🠔 🠕 🠖 🠗 หรือ ปุ่มบนหน้าจอ
        </div>

    </div>

    <!-- Game Script Logic -->
    <script>
        // --- Web Audio API retro sound generator ---
        class RetroSound {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playBeep(freq = 440, type = 'square', duration = 0.08, volume = 0.1) {
                if (this.muted) return;
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    console.log("Audio play error", e);
                }
            }

            eatSound() {
                this.playBeep(600, 'square', 0.05, 0.15);
                setTimeout(() => this.playBeep(850, 'square', 0.08, 0.15), 50);
            }

            dieSound() {
                this.playBeep(250, 'sawtooth', 0.15, 0.2);
                setTimeout(() => this.playBeep(180, 'sawtooth', 0.2, 0.2), 150);
                setTimeout(() => this.playBeep(120, 'sawtooth', 0.3, 0.2), 350);
            }

            moveSound() {
                this.playBeep(200, 'square', 0.015, 0.03);
            }

            buttonSound() {
                this.playBeep(400, 'sine', 0.03, 0.08);
            }
        }

        const sound = new RetroSound();

        // --- Game Logic Constants and Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20; // 20x20 grid
        let CELL_SIZE = 15;   // Calculated dynamically based on layout width

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;

        let score = 0;
        let highScore = localStorage.getItem('retro_snake_highscore') || 0;
        let gameSpeed = 100; // ms per frame
        let gameInterval = null;
        let isPaused = false;
        let isGameOver = false;
        let isGameRunning = false;

        // Colors (Retro GameBoy / LCD Style)
        const COLOR_BG = '#9bbc0f';
        const COLOR_DARK = '#0f380f';
        const COLOR_LIGHT = '#8bac0f';

        // --- UI Elements ---
        const currentScoreEl = document.getElementById('currentScore');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const menuBtn = document.getElementById('menuBtn');
        const speedLabel = document.getElementById('speedLabel');
        const gameStatus = document.getElementById('gameStatus');
        const soundToggle = document.getElementById('soundToggle');
        const soundIcon = document.getElementById('soundIcon');
        const soundText = document.getElementById('soundText');

        // Setup Responsive Canvas
        function resizeCanvas() {
            const containerWidth = canvas.parentElement.clientWidth;
            canvas.width = containerWidth;
            canvas.height = containerWidth;
            CELL_SIZE = canvas.width / GRID_SIZE;
            if (isGameRunning || isGameOver) {
                draw();
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // --- Initial Setup ---
        function init() {
            highScoreEl.innerText = String(highScore).padStart(4, '0');
            resizeCanvas();
            showMenuOverlay();
        }

        function showMenuOverlay() {
            isGameRunning = false;
            overlayTitle.innerText = "SNAKE II";
            overlaySub.innerText = "กด START เพื่อเริ่มเล่น";
            document.getElementById('difficultyBox').style.display = 'flex';
            startBtn.innerText = "START GAME";
            overlay.style.display = 'flex';
            gameStatus.innerText = "READY";
        }

        function startGame() {
            sound.buttonSound();
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            currentScoreEl.innerText = '0000';
            isGameOver = false;
            isPaused = false;
            isGameRunning = true;

            spawnFood();
            overlay.style.display = 'none';
            gameStatus.innerText = "PLAYING";

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                
                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        // --- Main Game Loop ---
        function gameLoop() {
            if (isPaused || isGameOver) return;

            // Apply buffered direction change
            dx = nextDx;
            dy = nextDy;

            // Compute new head position
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision Check
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                handleGameOver();
                return;
            }

            // Self Collision Check
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                handleGameOver();
                return;
            }

            // Add Head
            snake.unshift(head);

            // Food Collision Check
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                currentScoreEl.innerText = String(score).padStart(4, '0');
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.innerText = String(highScore).padStart(4, '0');
                    localStorage.setItem('retro_snake_highscore', highScore);
                }
                sound.eatSound();
                spawnFood();
            } else {
                snake.pop(); // Remove tail
            }

            draw();
        }

        // --- Rendering Logic ---
        function draw() {
            // Clear Screen
            ctx.fillStyle = COLOR_BG;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Pixel Grid Lines (Subtle)
            ctx.strokeStyle = COLOR_LIGHT;
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // Draw Food (Pixelated Square with inner gap)
            ctx.fillStyle = COLOR_DARK;
            const foodPadding = CELL_SIZE * 0.1;
            ctx.fillRect(
                food.x * CELL_SIZE + foodPadding,
                food.y * CELL_SIZE + foodPadding,
                CELL_SIZE - foodPadding * 2,
                CELL_SIZE - foodPadding * 2
            );

            // Draw Snake (Monochrome Retro Blocks)
            snake.forEach((segment, index) => {
                const padding = 1;
                ctx.fillStyle = COLOR_DARK;
                
                // Outer block
                ctx.fillRect(
                    segment.x * CELL_SIZE + padding,
                    segment.y * CELL_SIZE + padding,
                    CELL_SIZE - padding * 2,
                    CELL_SIZE - padding * 2
                );

                // Distinctive pattern for head
                if (index === 0) {
                    ctx.fillStyle = COLOR_BG;
                    const eyeSize = CELL_SIZE * 0.2;
                    // Draw eyes based on direction
                    if (dx === 1 || dx === -1) {
                        ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE/2 - eyeSize/2, segment.y * CELL_SIZE + 2, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE/2 - eyeSize/2, segment.y * CELL_SIZE + CELL_SIZE - 2 - eyeSize, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(segment.x * CELL_SIZE + 2, segment.y * CELL_SIZE + CELL_SIZE/2 - eyeSize/2, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE - 2 - eyeSize, segment.y * CELL_SIZE + CELL_SIZE/2 - eyeSize/2, eyeSize, eyeSize);
                    }
                }
            });
        }

        function handleGameOver() {
            isGameOver = true;
            isGameRunning = false;
            clearInterval(gameInterval);
            sound.dieSound();

            overlayTitle.innerText = "GAME OVER";
            overlaySub.innerText = `คะแนนที่ได้: ${score}`;
            document.getElementById('difficultyBox').style.display = 'none';
            startBtn.innerText = "TRY AGAIN";
            overlay.style.display = 'flex';
            gameStatus.innerText = "ENDED";
        }

        function togglePause() {
            if (!isGameRunning || isGameOver) return;
            sound.buttonSound();
            isPaused = !isPaused;
            if (isPaused) {
                gameStatus.innerText = "PAUSED";
                overlayTitle.innerText = "PAUSED";
                overlaySub.innerText = "เกมถูกพักไว้";
                document.getElementById('difficultyBox').style.display = 'none';
                startBtn.innerText = "RESUME";
                overlay.style.display = 'flex';
            } else {
                gameStatus.innerText = "PLAYING";
                overlay.style.display = 'none';
            }
        }

        // --- Controls Handling ---
        function changeDirection(dir) {
            if (isPaused || !isGameRunning) return;

            sound.moveSound();
            switch (dir) {
                case 'UP':
                    if (dy !== 1) { nextDx = 0; nextDy = -1; }
                    break;
                case 'DOWN':
                    if (dy !== -1) { nextDx = 0; nextDy = 1; }
                    break;
                case 'LEFT':
                    if (dx !== 1) { nextDx = -1; nextDy = 0; }
                    break;
                case 'RIGHT':
                    if (dx !== -1) { nextDx = 1; nextDy = 0; }
                    break;
            }
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    changeDirection('UP');
                    triggerBtnAnimation('btnUp');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    changeDirection('DOWN');
                    triggerBtnAnimation('btnDown');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    changeDirection('LEFT');
                    triggerBtnAnimation('btnLeft');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    changeDirection('RIGHT');
                    triggerBtnAnimation('btnRight');
                    break;
                case ' ':
                    e.preventDefault();
                    if (!isGameRunning && overlay.style.display !== 'none') {
                        startGame();
                    } else {
                        togglePause();
                    }
                    break;
            }
        });

        // Touch / Virtual D-Pad Event Binding
        const btnMap = [
            { id: 'btnUp', dir: 'UP' },
            { id: 'btnDown', dir: 'DOWN' },
            { id: 'btnLeft', dir: 'LEFT' },
            { id: 'btnRight', dir: 'RIGHT' }
        ];

        btnMap.forEach(item => {
            const btn = document.getElementById(item.id);
            
            const handlePress = (e) => {
                e.preventDefault();
                changeDirection(item.dir);
                triggerBtnAnimation(item.id);
            };

            btn.addEventListener('touchstart', handlePress, { passive: false });
            btn.addEventListener('mousedown', handlePress);
        });

        function triggerBtnAnimation(btnId) {
            const el = document.getElementById(btnId);
            if (el) {
                el.classList.add('active');
                setTimeout(() => el.classList.remove('active'), 100);
            }
        }

        // UI Event Listeners
        startBtn.addEventListener('click', () => {
            if (isPaused) {
                togglePause();
            } else {
                startGame();
            }
        });

        pauseBtn.addEventListener('click', togglePause);
        
        restartBtn.addEventListener('click', () => {
            sound.buttonSound();
            startGame();
        });

        menuBtn.addEventListener('click', () => {
            sound.buttonSound();
            if (gameInterval) clearInterval(gameInterval);
            showMenuOverlay();
        });

        // Difficulty Selection
        const diffButtons = document.querySelectorAll('.diff-btn');
        diffButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                sound.buttonSound();
                diffButtons.forEach(b => {
                    b.classList.remove('bg-[#0f380f]', 'text-[#9bbc0f]');
                    b.classList.add('bg-[#8bac0f]', 'text-[#0f380f]');
                });
                e.target.classList.remove('bg-[#8bac0f]', 'text-[#0f380f]');
                e.target.classList.add('bg-[#0f380f]', 'text-[#9bbc0f]');

                gameSpeed = parseInt(e.target.dataset.speed);
                if (gameSpeed === 150) speedLabel.innerText = "EASY";
                else if (gameSpeed === 100) speedLabel.innerText = "NORMAL";
                else speedLabel.innerText = "HARD";
            });
        });

        // Sound Toggle
        soundToggle.addEventListener('click', () => {
            sound.muted = !sound.muted;
            if (sound.muted) {
                soundIcon.innerText = "🔇";
                soundText.innerText = "SOUND OFF";
            } else {
                soundIcon.innerText = "🔊";
                soundText.innerText = "SOUND ON";
                sound.buttonSound();
            }
        });

        // Init Game on window load
        window.onload = init;
    </script>
</body>
</html>
