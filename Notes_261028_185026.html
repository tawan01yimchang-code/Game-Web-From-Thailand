<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Arcade - 15 ง่ายๆ คลายเครียด</title>
    <!-- นำเข้าฟอนต์ MiSans (หรือใช้ฟอนต์สไตล์โมเดิร์นทดแทน) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e8f5e9;
            --primary-color: #81c784;
            --secondary-color: #a5d6a7;
            --dark-color: #2e7d32;
            --accent-color: #66bb6a;
            --card-bg: #ffffff;
            --text-color: #1b5e20;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'MiSans', 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--primary-color);
            color: #fff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        header h1 {
            font-weight: 600;
            font-size: 1.8rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        header p {
            font-weight: 300;
            font-size: 0.95rem;
            margin-top: 5px;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            flex: 1;
            width: 100%;
        }

        /* หมวดหมู่เกม */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background-color: #c8e6c9;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            color: var(--dark-color);
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background-color: var(--dark-color);
            color: #fff;
        }

        /* ตารางเกม 15 เกม */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(46, 125, 50, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 2px solid #c8e6c9;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(46, 125, 50, 0.1);
            border-color: var(--accent-color);
        }

        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .game-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 5px;
        }

        .game-desc {
            font-size: 0.8rem;
            color: #4e8551;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .play-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .play-btn:hover {
            background-color: var(--dark-color);
        }

        /* หน้าจอเล่นเกม Modal */
        #game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            background: var(--primary-color);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
            text-align: center;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ปุ่มเปิด AI Chatbot ลอย */
        .ai-float-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--dark-color);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            z-index: 999;
        }

        .ai-float-btn:hover {
            transform: scale(1.1);
        }

        /* กล่อง AI Chat Modal */
        #ai-modal {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 320px;
            height: 400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--primary-color);
        }

        .ai-header {
            background: var(--primary-color);
            color: white;
            padding: 10px 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ai-chat-body {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
            background: #f9fbf9;
        }

        .chat-msg {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
        }

        .chat-msg.ai {
            background: #c8e6c9;
            color: var(--dark-color);
            align-self: flex-start;
        }

        .chat-msg.user {
            background: var(--primary-color);
            color: white;
            align-self: flex-end;
        }

        .ai-chat-footer {
            display: flex;
            padding: 8px;
            background: white;
            border-top: 1px solid #eee;
        }

        .ai-chat-footer input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
        }

        .ai-chat-footer button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            margin-left: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        /* สไตล์สำหรับจำลองมินิเกมภายใน */
        .mini-box {
            background: #f1f8f1;
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            padding: 15px;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 Green Relax Arcade 🌿</h1>
        <p>15 เกมง่ายๆ คลายเครียด สีเขียวสบายตา</p>
    </header>

    <div class="container">
        <!-- หมวดหมู่ -->
        <div class="categories">
            <button class="cat-btn active" onclick="filterGames('all')">ทั้งหมด (15)</button>
            <button class="cat-btn" onclick="filterGames('puzzle')">พัซเซิล & ฝึกสมอง</button>
            <button class="cat-btn" onclick="filterGames('casual')">ชิลๆ เพลินๆ</button>
            <button class="cat-btn" onclick="filterGames('speed')">ไวไว ขำๆ</button>
        </div>

        <!-- ตารางแสดง 15 เกม -->
        <div class="game-grid" id="gameGrid">
            <!-- เกมจะถูกสร้างด้วย JavaScript หรือใส่โครงสร้างตรงๆ -->
        </div>
    </div>

    <!-- ปุ่มเปิด AI คุยแก้เครียด -->
    <button class="ai-float-btn" onclick="toggleAIChat()" title="คุยกับเพื่อนซี้ AI">🤖</button>

    <!-- หน้าต่าง AI Chatbot -->
    <div id="ai-modal">
        <div class="ai-header">
            <span>AI เพื่อนคลายเครียด 🍃</span>
            <button class="close-btn" style="font-size: 1.1rem;" onclick="toggleAIChat()">×</button>
        </div>
        <div class="ai-chat-body" id="aiChatBody">
            <div class="chat-msg ai">สวัสดีจ้า! เหนื่อยหรือเครียดจากอะไรมา คุยกับเราได้เสมอนะ อยากให้เล่าให้ฟังหรือหาเกมสนุกๆ เล่นไหม? 😊</div>
        </div>
        <div class="ai-chat-footer">
            <input type="text" id="aiInput" placeholder="พิมพ์คุยกับ AI..." onkeypress="handleAIKeyPress(event)">
            <button onclick="sendAIMessage()">ส่ง</button>
        </div>
    </div>

    <!-- Modal เล่นเกม -->
    <div id="game-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalGameTitle">ชื่อเกม</h3>
                <button class="close-btn" onclick="closeGameModal()">×</button>
            </div>
            <div class="modal-body" id="modalGameBody">
                <!-- เนื้อหาเกมจำลอง -->
            </div>
        </div>
    </div>

    <script>
        // รายชื่อ 15 เกมง่ายๆ คลายเครียด
        const games = [
            { id: 1, title: "เป่ายิ้งฉุบคลายเครียด", cat: "casual", icon: "✊", desc: "วัดดวงกับบอท ขำๆ คลายสมอง", type: "rps" },
            { id: 2, title: "จิ้มตัวเลขไวไว", cat: "speed", icon: "🔢", desc: "เรียงตัวเลข 1 ถึง 9 ให้ไวที่สุด", type: "numbers" },
            { id: 3, title: "ทายหัวก้อยเสี่ยงทาย", cat: "casual", icon: "🪙", desc: "วันนี้ดวงดีไหม ลองเสี่ยงทายดูสิ", type: "coin" },
            { id: 4, title: "จับคู่สีพาสเทล", cat: "puzzle", icon: "🎨", desc: "ฝึกความจำเปิดป้ายจับคู่สี", type: "memory" },
            { id: 5, title: "นับแกะนอนหลับ", cat: "casual", icon: "🐑", desc: "กดนับแกะกระโดด ช่วยให้ผ่อนคลาย", type: "sheep" },
            { id: 6, title: "หมุนวงล้อตัดสินใจ", cat: "casual", icon: "🎡", desc: "คิดไม่อกล, ให้วงล้อช่วยเลือก", type: "wheel" },
            { id: 7, title: "เคาะแมງมุมคลายเครียด", cat: "speed", icon: "🕷️", desc: "กดเป้าหมายที่โผล่ขึ้นมาให้ทัน", type: "whack" },
            { id: 8, title: "ทายใจทายเลข 1-10", cat: "puzzle", icon: "🔮", desc: "ให้ AI ทายเลขในใจคุณสิ", type: "guess" },
            { id: 9, title: "เป่าลูกโป่งยักษ์", cat: "casual", icon: "🎈", desc: "สูบลมลูกโป่งแล้วดูมันลอยไป", type: "balloon" },
            { id: 10, title: "แตะจังหวะผ่อนคลาย", cat: "speed", icon: "🎵", desc: "กดตามไฟกระพริบชิลๆ", type: "rhythm" },
            { id: 11, title: "เช็คดวงความสุขรายวัน", cat: "casual", icon: "🍀", desc: "สุ่มรับคำคมบวกๆ เติมพลังใจ", type: "fortune" },
            { id: 12, title: "ต่อบล็อกสีเขียว", cat: "puzzle", icon: "🟩", desc: "เกมพัซเซิลต่อแถวเบาๆ", type: "blocks" },
            { id: 13, title: "เครื่องคิดเลขรัก-ใคร่", cat: "casual", icon: "💖", desc: "คำนวณความสุขขำๆ แก้เซ็ง", type: "love" },
            { id: 14, title: "เกมจับผิดจุดต่าง", cat: "puzzle", icon: "🔍", desc: "หาความต่างง่ายๆ ในพริบตา", type: "diff" },
            { id: 15, title: "วาดเส้นระบายสีใจ", cat: "casual", icon: "🖌️", desc: "จิ้มสุ่มสีแต่งแต้มหน้าจอเพลินๆ", type: "draw" }
        ];

        // เรนเดอร์รายการเกม
        function renderGames(filter = 'all') {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? games : games.filter(g => g.cat === filter);
            
            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div>
                        <div class="game-icon">${game.icon}</div>
                        <div class="game-title">${game.title}</div>
                        <div class="game-desc">${game.desc}</div>
                    </div>
                    <button class="play-btn" onclick="openGame(${game.id})">เล่นเลย</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterGames(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderGames(cat);
        }

        // เปิดเกมจำลองใน Modal
        function openGame(id) {
            const game = games.find(g => g.id === id);
            document.getElementById('modalGameTitle').innerText = game.icon + " " + game.title;
            const body = document.getElementById('modalGameBody');
            
            // สร้างเนื้อหาเกมตามประเภท
            if (game.type === 'rps') {
                body.innerHTML = `
                    <p>เลือกอาวุธของคุณสู้กับบอท!</p><br>
                    <div style="font-size: 2rem; margin: 10px;">
                        <button onclick="playRPS('✊')" style="font-size:1.5rem; padding:10px; cursor:pointer;">✊</button>
                        <button onclick="playRPS('✋')" style="font-size:1.5rem; padding:10px; cursor:pointer;">✋</button>
                        <button onclick="playRPS('✌️')" style="font-size:1.5rem; padding:10px; cursor:pointer;">✌️</button>
                    </div>
                    <div id="rpsResult" style="margin-top:15px; font-weight:bold; color:var(--dark-color);">เลือกเลย!</div>
                `;
            } else if (game.type === 'coin') {
                body.innerHTML = `
                    <p>โยนเหรียญเสี่ยงทาย หัวหรือก้อย?</p><br>
                    <div id="coinDisplay" style="font-size: 4rem; margin: 10px;">🪙</div>
                    <button class="play-btn" onclick="flipCoin()" style="margin-top:10px;">โยนเหรียญ</button>
                `;
            } else if (game.type === 'sheep') {
                body.innerHTML = `
                    <p>นับแกะกระโดดเพื่อความสงบสุข</p>
                    <h2 id="sheepCount" style="font-size: 2.5rem; color: var(--dark-color); margin: 15px 0;">0 ตัว 🐑</h2>
                    <button class="play-btn" onclick="countSheep()">เพิ่มแกะ 1 ตัว</button>
                `;
            } else {
                body.innerHTML = `
                    <div class="mini-box">
                        <p style="margin-bottom: 10px;">🎮 โหมดจำลองความสนุกสำหรับ "${game.title}"</p>
                        <p style="font-size: 0.9rem; color: #555;">กดปุ่มด้านล่างเพื่อรีเซ็ตความสุข!</p>
                    </div>
                    <button class="play-btn" style="margin-top: 15px;" onclick="alert('ยอดเยี่ยม! ผ่อนคลายขึ้นแล้วใช่ไหม 😊')">กดรับพลังบวก (+1)</button>
                `;
            }

            document.getElementById('game-modal').style.display = 'flex';
        }

        function closeGameModal() {
            document.getElementById('game-modal').style.display = 'none';
        }

        // มินิเกมย่อยๆ ใน Modal
        function playRPS(userChoice) {
            const choices = ['✊', '✋', '✌️'];
            const botChoice = choices[Math.floor(Math.random() * choices.length)];
            let res = "";
            if (userChoice === botChoice) res = "เสมอว์! 🤝";
            else if ((userChoice === '✊' && botChoice === '✌️') || (userChoice === '✋' && botChoice === '✊') || (userChoice === '✌️' && botChoice === '✋')) res = "คุณชนะ! 🎉";
            else res = "บอทชนะ! 😜";
            
            document.getElementById('rpsResult').innerHTML = `คุณ: ${userChoice} | บอท: ${botChoice}<br><span style="font-size:1.2rem;">${res}</span>`;
        }

        let sheepNum = 0;
        function countSheep() {
            sheepNum++;
            document.getElementById('sheepCount').innerText = sheepNum + " ตัว 🐑";
        }

        function flipCoin() {
            const results = ['หัว! 👑', 'ก้อย! 🦅'];
            const res = results[Math.floor(Math.random() * results.length)];
            document.getElementById('coinDisplay').innerHTML = res.includes('หัว') ? '👑' : '🦅';
            setTimeout(() => alert("ผลลัพธ์คือ: " + res), 100);
        }

        // ระบบ AI คุยแก้เครียด
        function toggleAIChat() {
            const modal = document.getElementById('ai-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendAIMessage() {
            const input = document.getElementById('aiInput');
            const text = input.value.trim();
            if(!text) return;

            const chatBody = document.getElementById('aiChatBody');
            
            // ข้อความผู้ใช้
            chatBody.innerHTML += `<div class="chat-msg user">${text}</div>`;
            input.value = '';
            chatBody.scrollTop = chatBody.scrollHeight;

            // ตอบกลับจาก AI (จำลองบทสนทนาฮีลใจ)
            setTimeout(() => {
                let aiReply = "เข้าใจเลยนะ พักผ่อนสายตาแล้วมาเล่นเกมขำๆ กันก่อนได้นะ สู้ๆ! 💚";
                const lower = text.toLowerCase();
                if(lower.includes('เครียด') || lower.includes('เหนื่อย')) {
                    aiReply = "เหนื่อยมากล่ะสิ ลองสูดหายใจเข้าลึกๆ หายใจออกยาวๆ แล้วเลือกเกมในนี้ไปกดเล่นเพลินๆ สัก 5 นาทีนะ ฉันอยู่ตรงนี้เป็นเพื่อนเสมอ!";
                } else if(lower.includes('เหงา')) {
                    aiReply = "มีเราคุยด้วยทั้งคน ไม่เหงาแน่นอน! มาเล่าเรื่องตลกหรือเรื่องที่เจอวันนี้ให้ฟังหน่อยสิ";
                } else if(lower.includes('หิว')) {
                    aiReply = "โอ๊ะ! ถ้าหิวต้องหาของอร่อยกินเติมพลังก่อนนะ ค่อยกลับมาเล่นเกมใหม่ กินอิ่มนอนหลับคือที่สุดแล้วจ้า";
                }

                chatBody.innerHTML += `<div class="chat-msg ai">${aiReply}</div>`;
                chatBody.scrollTop = chatBody.scrollHeight;
            }, 600);
        }

        function handleAIKeyPress(e) {
            if(e.key === 'Enter') sendAIMessage();
        }

        // เริ่มต้นโหลดเกมทั้งหมด
        renderGames();
    </script>
</body>
</html>
